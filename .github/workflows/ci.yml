name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  levels:
    name: Проверка уровней (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пересобрать уровни
        run: python tools/build_levels.py
      - name: Проверить уровни
        run: python tools/level_tool.py validate

  server:
    name: Сборка и тесты сервера (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: [levels, server]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t platok-i-boroda .
      - name: Проверить, что контейнер отвечает
        run: |
          docker run -d -p 3000:3000 --name pib platok-i-boroda
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs pib
          exit 1
